<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="HomePage.css">
  <title>Home Page</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">Röstereien</h1>
      <button class="filter-button">
        <img src="../../assets/icon.png" class="filter-icon" alt="Filter">
      </button>
    </div>

    <div class="scrollable">
      <div class="roasteries">
        <!-- Dummy Roasteries will be inserted here dynamically -->
      </div>

      <div class="section">
        <h2 class="section-title">Herkunftsländer</h2>
        <div class="origin-countries">
          <!-- Dummy Origin Countries will be inserted here dynamically -->
        </div>
      </div>
      
      <div class="section">
        <h2 class="section-title">Kaffeebohnen</h2>
        <div class="coffee-beans">
          <!-- Dummy Coffee Beans will be inserted here dynamically -->
        </div>
      </div>
      
      <div class="section">
        <h2 class="section-title">Kaffees</h2>
        <div class="coffees">
          <!-- Dummy Coffees will be inserted here dynamically -->
        </div>
      </div>
    </div>

    <div class="bottom-navigation">
      <button class="nav-item">
        <img src="../../assets/icon.png" class="nav-icon" alt="Navigation">
      </button>
      <button class="nav-item">
        <img src="../../assets/icon.png" class="nav-icon" alt="Navigation">
      </button>
      <button class="nav-item">
        <img src="../../assets/icon.png" class="nav-icon" alt="Navigation">
      </button>
      <button class="nav-item">
        <img src="../../assets/icon.png" class="nav-icon" alt="Navigation">
      </button>
    </div>
  </div>

  <script src="HomePage.js"></script>
</body>
</html>
